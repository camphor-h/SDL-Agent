plugins {
    id 'com.android.application'
}

def apiJson = rootProject.file("../assets/api.json")
def apiAssetsDir = layout.buildDirectory.dir("generated/apiAssets")

tasks.register("copyApiJson", Copy) {
    onlyIf { apiJson.exists() }
    from apiJson
    into apiAssetsDir
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace = "org.libsdl.app"
    compileSdkVersion 36
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "org.sdlagent"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 261103
        versionName "26.11.3"

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-24", "-DANDROID_STL=c++_static"
                abiFilters 'arm64-v8a'
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDirs += apiAssetsDir.get().asFile
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
            .dependsOn("copyApiJson")
    }

    externalNativeBuild {
        cmake {
            path 'jni/CMakeLists.txt'
        }
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}

//Lint tasks also read the merged assets directory.
tasks.configureEach { task ->
    if (task.name.toLowerCase().contains("lint")) {
        task.dependsOn("copyApiJson")
    }
}
